name: Build Maira AI APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          rm -rf app build.gradle settings.gradle gradle gradlew
          mkdir -p app/src/main/java/com/maira/ai
          mkdir -p gradle/wrapper
          
          curl -sLO https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.jar
          mv gradle-wrapper.jar gradle/wrapper/
          curl -sLO https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.properties
          mv gradle-wrapper.properties gradle/wrapper/
          sed -i "s|gradle-.*-bin.zip|gradle-8.5-bin.zip|" gradle/wrapper/gradle-wrapper.properties
          
          echo "#!/bin/sh" > gradlew
          echo "exec java -jar gradle/wrapper/gradle-wrapper.jar \"\$@\"" >> gradlew
          chmod +x gradlew
          
          cat > settings.gradle << 'EOF'
          include ':app'
          EOF
          
          cat > build.gradle << 'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          
          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          android {
              compileSdkVersion 34
              namespace 'com.maira.ai'
              defaultConfig {
                  applicationId "com.maira.ai"
                  minSdkVersion 21
                  targetSdkVersion 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="Maira AI">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          cat > app/src/main/java/com/maira/ai/MainActivity.java << 'EOF'
          package com.maira.ai;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              protected void onCreate(Bundle b){
                  super.onCreate(b);
                  WebView w=new WebView(this);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.setWebViewClient(new WebViewClient());
                  w.loadUrl("https://r29313409-cloud.github.io/-MairaAI/");
                  setContentView(w);
              }
          }
          EOF
          
          ./gradlew assembleDebug --stacktrace
          
      - uses: actions/upload-artifact@v4
        with:
          name: Maira-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
