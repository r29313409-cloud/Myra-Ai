name: Build Maira AI APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          rm -rf app build.gradle settings.gradle gradle gradlew
          mkdir -p app/src/main/java/com/maira/ai
          mkdir -p gradle/wrapper
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          cat > gradlew << 'GRADLE'
          #!/bin/sh
          exec gradle "$@"
          GRADLE
          chmod +x gradlew
          cat > settings.gradle << 'EOF'
          include ':app'
          EOF
          cat > build.gradle << 'EOF'
          task wrapper(type: Wrapper) { gradleVersion = '8.5' }
          EOF
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              compileSdk 34
              namespace 'com.maira.ai'
              defaultConfig { applicationId "com.maira.ai"; minSdk 21; targetSdk 34; versionCode 1; versionName "1.0" }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="Maira AI"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application>
          </manifest>
          EOF
          cat > app/src/main/java/com/maira/ai/MainActivity.java << 'EOF'
          package com.maira.ai;
          import android.app.Activity; import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              protected void onCreate(Bundle b){
                  super.onCreate(b);
                  WebView w=new WebView(this);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.setWebViewClient(new WebViewClient());
                  w.loadUrl("https://r29313409-cloud.github.io/-MairaAI/");
                  setContentView(w);
              }
          }
          EOF
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Maira-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apkname: Build Maira AI APK
